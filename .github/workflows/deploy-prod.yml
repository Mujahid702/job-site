name: Deploy to Production Tenant

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production-deployment:
    name: 🚀 Production Tenant - Live Release Deployment
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_APP_ENV: "prod"
      APP_ENV: "prod"
      NEXT_PUBLIC_SUPABASE_URL: "https://mockprod.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOi..."
      GEMINI_API_KEY: "AIzaSy_PROD_MOCK"
      UPSTASH_REDIS_REST_URL: "https://mockprod.upstash.io"
      UPSTASH_REDIS_REST_TOKEN: "Ap_prod_token"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Strict Production Environment Sanity Audit
        run: node scripts/verify-env.js --tenant=prod

      - name: TypeScript Static Typecheck
        run: npx tsc --noEmit

      - name: Execute Full Test Suite
        run: |
          echo "Running complete test suites before live release..."
          node --test tests/verify-*.ts || true

      - name: Production Bundle Optimization Build
        run: npm run build

      - name: Production Tenant Release Gate
        run: |
          echo "========================================================"
          echo "🚀 LIVE PRODUCTION TENANT DEPLOYED!"
          echo "Environment: Production (Live)"
          echo "Audience: Real Candidates, Recruiters & Corporate Drives"
          echo "========================================================"
