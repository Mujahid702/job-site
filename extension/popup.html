<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent-green: #10b981;
      --border-color: #334155;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      width: 320px;
      box-sizing: border-box;
    }

    .container {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header styling */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-b: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
    }

    .brand-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    /* Settings section */
    .section-title {
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    input {
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 600;
      outline: none;
      transition: all 0.2s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
    }

    button {
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    /* Toggle Switch */
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #475569;
      transition: .3s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent-green);
    }

    input:checked + .slider:before {
      transform: translateX(16px);
    }

    /* Job context styling */
    .job-details-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .job-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
    }

    .company-label {
      font-size: 10px;
      background-color: rgba(99, 102, 241, 0.1);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.2);
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      font-weight: 800;
    }

    .meta-text {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 700;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .bg-green { background-color: var(--accent-green); }
    .bg-red { background-color: #f43f5e; }
    
    .alert-banner {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
      display: none;
    }

    .alert-success {
      background-color: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: var(--accent-green);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">B</div>
      <div>
        <div class="brand-title">Placement Tracker OS</div>
        <div class="status-badge" style="margin-top: 2px;">
          <div id="statusDot" class="status-dot bg-red"></div>
          <span id="statusText" style="color: var(--text-muted)">API Offline</span>
        </div>
      </div>
    </div>

    <div class="alert-banner alert-success" id="alertBanner">
      Sync Successful ✓
    </div>

    <!-- Active Job parsing panel -->
    <div class="section-title">Active Tab Scanner</div>
    <div class="card">
      <div id="noJobView" style="font-size: 11px; color: var(--text-muted); text-align: center; padding: 12px 0;">
        Navigate to a supported job page to capture details.
      </div>
      <div id="jobView" class="job-details-box" style="display: none;">
        <div>
          <div id="jobTitle" class="job-title">Software Engineer</div>
          <div style="margin-top: 6px;">
            <span id="jobCompany" class="company-label">Google</span>
          </div>
        </div>
        
        <div class="meta-text">
          📍 <span id="jobLoc">Bengaluru, KA</span><br>
          🌐 <span id="jobSrc">LinkedIn Easy Apply</span>
        </div>

        <button id="btnAddToCRM" style="margin-top: 4px;">Add to CRM Ingestion</button>
      </div>
    </div>

    <!-- Sync preferences -->
    <div class="section-title">Capture Mappings</div>
    <div class="card toggle-row">
      <span style="font-size: 11px; font-weight: 700;">Auto-sync on Apply Submit</span>
      <label class="switch">
        <input type="checkbox" id="toggleAutoAdd" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- API configuration settings -->
    <div class="section-title">Authorization Mappings</div>
    <div class="card input-group">
      <input type="password" id="inputToken" placeholder="Paste Extension API Key here">
      <button id="btnSaveConfig">Save Token Key</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
